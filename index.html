<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Address(0) — not just developers, we're sales planners</title>
    <meta
      name="description"
      content="Address(0) builds landing pages engineered for conversion. Strategy, positioning, and execution — not just code, but a plan to sell."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <style>
      /* First-paint loader: shown before React boots (static splash below)
         and during lazy page chunks (same markup, rendered by React). */
      .ten-loader {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 0.85rem;
        margin: 0;
        padding: 2rem;
        background: #fbfaf8;
        color: #17171a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .ten-loader__brand {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .ten-loader__hint {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #6b6b74;
      }
      .ten-loader__bar {
        width: min(11rem, 52vw);
        height: 3px;
        margin: 0.35rem auto 0;
        overflow: hidden;
        background: rgba(23, 23, 26, 0.14);
      }
      .ten-loader__bar > span {
        display: block;
        width: 38%;
        height: 100%;
        background: linear-gradient(90deg, #17171a 0 82%, #c6f24e 82% 100%);
        animation: ten-load-slide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes ten-load-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(290%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ten-loader__bar > span {
          animation: none;
          transform: translateX(80%);
        }
      }
    </style>
    <script>
      window.__TEN_AV__ = "1.0.0";
    </script>
    <script>
      // Restores SPA routes forwarded by 404.html on static hosting.
      (function () {
        var l = window.location;
        if (l.search.slice(0, 2) === '?/') {
          var parts = l.search.slice(2).split('&');
          var path = parts
            .join('?')
            .replace(/~and~/g, '&');
          var base = l.pathname.replace(/\/$/, '');
          window.history.replaceState(null, '', base + '/' + path + l.hash);
        }
      })();
    </script>
    <script>
      // First-paint styles: the per-page stylesheet used to load only after
      // React rendered, flashing unstyled content. Load this route's sheet
      // synchronously now (render-blocking, before <body> parses) and
      // preload the rest so client-side navigation is instant. Only one
      // sheet is ever applied — each sets :root tokens, so they must not
      // all apply at once. Runs after the restore script above, so the
      // real route is visible even on 404-forwarded loads.
      (function () {
        var FILES = ['404', 'atelier', 'index', 'lumen', 'saffron', 'wanderly'];
        var probe = document.querySelector('link[rel="stylesheet"]');
        var probeHref = probe ? probe.getAttribute('href') || '' : '';
        var base = probeHref.split('/assets/')[0] + '/';
        var baseSegs = base.split('/').filter(Boolean);
        var segs = window.location.pathname.split('/').filter(Boolean);
        if (baseSegs.length && segs.slice(0, baseSegs.length).join('/') === baseSegs.join('/')) {
          segs = segs.slice(baseSegs.length);
        }
        var at = segs.indexOf('p');
        var slug = at !== -1 && segs[at + 1] ? segs[at + 1] : segs.length ? '404' : 'index';
        if (FILES.indexOf(slug) === -1) slug = slug === 'index' ? 'index' : '404';
        function addLink(rel, name) {
          var link = document.createElement('link');
          link.setAttribute('rel', rel);
          if (rel === 'preload') {
            link.setAttribute('as', 'style');
          } else {
            // Seo.tsx reuses this exact node instead of appending a second
            // stylesheet for the same file.
            link.setAttribute('data-page-css', '');
          }
          link.setAttribute('href', base + 'assets/css/pages/' + name + '.css');
          document.head.appendChild(link);
        }
        addLink('stylesheet', slug);
        for (var i = 0; i < FILES.length; i += 1) {
          if (FILES[i] !== slug) addLink('preload', FILES[i]);
        }
      })();
    </script>
    <script src="/assets/js/transition.js" defer></script>
    <script src="/assets/js/enquiry.js" defer></script>
    <script src="/assets/js/gallery.js" defer></script>
    <script src="/assets/js/modal.js" defer></script>
    <script src="/assets/js/booking.js" defer></script>
    <script src="/assets/js/signature.js" defer></script>
  </head>
  <body data-slug="">
    <div id="root">
      <div class="ten-loader" aria-hidden="true">
        <p class="ten-loader__brand">Address(0)</p>
        <p class="ten-loader__hint">Loading</p>
        <p class="ten-loader__bar" aria-hidden="true"><span></span></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!-- GitHub Pages serves this file for unknown paths (project site, so
      one path segment — the repo name — is kept). It forwards the route to
      index.html, which restores it. Based on rafgraph/spa-github-pages. -->
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var base = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
        var route =
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(base + '?/' + route);
      })();
    </script>
  </head>
  <body></body>
</html>
